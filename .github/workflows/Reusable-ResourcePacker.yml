name: Reusable | ResourcePacker

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      matrix_version:
        required: true
        type: string
      release:
        required: true
        type: boolean
      release_version:
        required: false
        type: string
    secrets:
      AWS_S3_BUCKET:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_S3_ENDPOINT:
        required: true
      OVERRIDE_CACHE_URL:
        required: true

jobs:
  image-resizer:
    name: Pack Image Resizer

    uses: ./.github/workflows/Reusable-ImageResize.yml
    with:
      matrix_version: ${{ inputs.matrix_version }}

  ResourcePacker:
    name: ResourcePacker ${{ inputs.matrix_version }}
    runs-on: ubuntu-latest
    needs: [ image-resizer ]

    steps:
      - name: Checking Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: 1.8.5

      - name: Setup a local virtual environment
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - name: Cache Python
        uses: actions/cache@v5
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}

      - name: Install project dependencies
        run: poetry install

      - name: Pack mcmeta generate
        run: |
          python3 .github/scripts/mcmeta_generate.py
        env:
          release: ${{ inputs.release }}
          release_version: ${{ inputs.release_version }}
          matrix_version: ${{ inputs.matrix_version }}

      - name: Download cache archive
        if: github.event_name != 'pull_request'
        run: |
          wget ${{ secrets.OVERRIDE_CACHE_URL }}

      - name: Extract cache archive
        if: github.event_name != 'pull_request'
        run: |
          unzip override.zip || true
          rm override.zip

      - name: MultiVersions mixer
        run: |
          poetry run python .github/scripts/multiversions.py
        env:
          matrix_version: ${{ inputs.matrix_version }}
          LOGURU_LEVEL: "INFO"

      - name: Move Patch
        run: |
          poetry run python .github/scripts/pacther_mover.py
        env:
          LOGURU_LEVEL: "INFO"
          matrix_version: ${{ inputs.matrix_version }}

      - name: Copy misc things
        run: |
          cp MultiVersions/configs/pack.mcmeta pack/
          cp LICENSE pack/
          if [[ -d "MultiVersions/Override/" ]]; then
            cp MultiVersions/Override/LICENSE_* pack/
          fi

      - name: Apply Pack Icon
        uses: actions/download-artifact@v8
        with:
          name: PackIcon-${{ inputs.matrix_version }}
          path: pack/

      - name: Make ModsTranslationPack
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest-unstable
          options: |
            pack_directory = 'pack'
            never_store_squash_times = true
            ignore_system_and_hidden_files = false

            # 全域規則
            ['{LICENSE,LICENSE_*}']
            force_include = true
            ['**/*?.lang']
            force_include = true
            ['**/*?.md']
            force_include = true
            ['**/*?.mdx']
            force_include = true
            ['**/*?.sfml']
            force_include = true

            # AE2 Guide 系列 (png, snbt)
            ['assets/*/ae2guide/**/*?.png']
            force_include = true
            ['assets/*/ae2guide/**/*?.snbt']
            force_include = true

            # Patchouli Books 翻譯 (zh_tw json)
            ['assets/*/patchouli_books/**/zh_tw/**/*?.json']
            force_include = true

            # 其他模組專用
            ['assets/immersiveengineering/manual/zh_tw/*?.txt']
            force_include = true
            ['assets/alexscaves/books/zh_tw/**/*?.txt']
            force_include = true
            ['assets/oritech/oracle_index/books/oritech/.translated/zh_tw/**/*?.json']
            force_include = true
            ['assets/oritech/oracle_index/books/oritech/.translated/zh_tw/**/*?.json']
            force_include = true
            ['assets/oritech/oracle_index/books/oritech/.translated/zh_tw/**/_meta.json']
            sort_json_object_keys = false
          artifact_name: OptimizedPack-${{ inputs.matrix_version }}

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: OptimizedPack-${{ inputs.matrix_version }}
          path: ./

      - name: Rename ModsTranslationPack
        run: |
          mv ./pack.zip ModsTranslationPack-${{ inputs.matrix_version }}.zip

      - name: Make Checksum
        run: |
          sha256sum ModsTranslationPack-${{ inputs.matrix_version }}.zip > checksum.txt

      - name: Upload ModsTranslationPack
        uses: actions/upload-artifact@v7
        with:
          name: ModsTranslationPack-${{ inputs.matrix_version }}
          path: |
            *.zip
            checksum.txt

  delete-artifact:
    name: Delete Artifact
    needs: [ ResourcePacker ]

    uses: ./.github/workflows/Reusable-DeleteArtifact.yml
    with:
      artifact_name: |
        OptimizedPack-${{ inputs.matrix_version }}
        PackIcon-${{ inputs.matrix_version }}
