name: Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "Translation/**"
      - "config/minecraft_versions.json"
      - "config/settings.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "Translation/**"
      - "config/minecraft_versions.json"
      - "config/settings.json"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: TeamKugimiya/reusable-workflows/.github/workflows/TranslationPack-Validate.yml@v1
    with:
      project_path: .
    secrets: inherit

  build:
    needs: validate
    uses: TeamKugimiya/reusable-workflows/.github/workflows/TranslationPack-Build.yml@v1
    with:
      pack_name: ModsTranslationPack
    secrets: inherit

  release:
    name: Release ${{ matrix.version }}
    if: |
      github.repository == 'TeamKugimiya/ModsTranslationPack' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    needs: build
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.build.outputs.release_targets) }}
    uses: TeamKugimiya/reusable-workflows/.github/workflows/TranslationPack-Release.yml@v1
    with:
      version: ${{ matrix.version }}
      artifact_pattern: ${{ matrix.zip }}
      release_name: ${{ matrix.version }}｜git ${{ needs.build.outputs.short_sha }}
      release_version: git-${{ needs.build.outputs.short_sha }}
      game_versions: ${{ matrix.game_versions }}
      update_ci_latest: ${{ matrix.update_ci_latest }}
      modrinth_id: "cF5VXmkW"
      curseforge_id: "1242047"
      project_id: modstranslationpack
    secrets:
      anvil_api_token: ${{ secrets.ANVIL_API_TOKEN }}
      modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
      curseforge_token: ${{ secrets.CURSEFORGE_TOKEN }}
